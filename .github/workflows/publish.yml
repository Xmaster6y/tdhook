name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  package:
    uses: ./.github/workflows/package.yml

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-distributions
        path: dist
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
